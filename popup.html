<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #e0e0e0;
      width: 240px;
      padding: 18px 16px 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .header img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
    }

    .header h3 {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      color: #f65b66;
    }

    .header span {
      font-size: 11px;
      color: #888;
    }

    .status-card {
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      transition: background 0.3s;
    }

    .status-card.on  { background: #006400; border: 1px solid #1e6b3a; }
    .status-card.off { background: #8b0000; border: 1px solid #5c2626; }

    .status-left { display: flex; align-items: center; gap: 8px; }

    .dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .on  .dot { background: #4ade80; box-shadow: 0 0 6px #4ade80aa; }
    .off .dot { background: #f87171; box-shadow: 0 0 6px #f87171aa; }

    .status-text { font-size: 13px; font-weight: 600; }
    .on  .status-text { color: #4ade80; }
    .off .status-text { color: #f87171; }

    .status-sub { font-size: 11px; color: #ffffff; margin-top: 1px; }

    .toggle-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
    }
    .toggle-btn:hover { background: rgba(255,255,255,0.08); }
    .toggle-btn svg { width: 28px; height: 16px; }

    /* switch SVG */
    .track {
      transition: fill 0.3s;
    }
    .on  .track { fill: #22c55e; }
    .off .track { fill: #929090; }

    .thumb {
      transition: transform 0.3s;
    }
    .on  .thumb { transform: translateX(12px); }
    .off .thumb { transform: translateX(0px); }

    .footer { 
      font-size: 10px; 
      color: #7a7373; 
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon_48.png" alt="ícone">
    <div>
      <h3>DeepLearning.AI<br>PT-BR Captions</h3>
    </div>
  </div>

  <div class="status-card off" id="card">
    <div class="status-left">
      <div class="dot"></div>
      <div>
        <div class="status-text" id="statusText">Desativado</div>
        <div class="status-sub" id="statusSub">Clique para ativar a tradução</div>
      </div>
    </div>
    <button class="toggle-btn" id="toggleBtn" title="Ativar / Desativar">
      <svg viewBox="0 0 28 16" xmlns="http://www.w3.org/2000/svg">
        <rect class="track" x="0" y="2" width="28" height="12" rx="6"/>
        <circle class="thumb" cx="8" cy="8" r="6" fill="white"/>
      </svg>
    </button>
  </div>

  <div class="footer">
    <img src="icons/mark-github-24.svg" width="16" height="16" alt="github">
    <span>github.com/wsmedeiros</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
